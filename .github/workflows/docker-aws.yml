name: Docker CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - src/**
  pull_request:
    branches: [ main ]
    paths:
      - src/**

jobs:
  build-and-deploy:
    name: Build, Push and Deploy to AWS
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4
      
      # 2. Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3 
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # 3. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true 
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_APP_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_APP_NAME }}:${{ github.sha }}
      
      # 4. Copy docker-compose.yml via SCP
      - name: Copy docker-compose to AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOSTNAME }}
          username: ${{ secrets.AWS_USERNAME }}
          port: 22
          key: ${{ secrets.AWS_PRIVATEKEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.AWS_USERNAME }}/"
          strip_components: 0
      
      # 5. Deploy Docker services on AWS
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOSTNAME }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATEKEY }}
          port: 22
          script: |
            # Login to DockerHub on EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Navigate to the directory
            cd /home/${{ secrets.AWS_USERNAME }}
            
            # Pull the latest image
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_APP_NAME }}:latest
            
            # Stop and remove old containers
            docker compose down
            
            # Remove old images (optional: remove all to force fresh pull)
            docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_APP_NAME }}:latest || true
            
            # Start new containers
            docker compose up -d
            
            # Clean up unused images and volumes
            docker system prune -af --volumes
            
            # Show running containers (for debugging)
            docker ps
